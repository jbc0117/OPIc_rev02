<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OPIc 연습 프로그램</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #111827; /* bg-gray-900 */
            -webkit-tap-highlight-color: transparent;
        }
        .phone-container {
            /* Galaxy S25 Ultra (예상) 비율에 최적화 */
            max-width: 432px; /* 1440px / 3.33 (density) */
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available; /* iOS Safari full height */
            margin: 0 auto;
            background-color: #030712; /* bg-gray-950 */
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .glass-ui {
            background: rgba(30, 41, 59, 0.5); /* bg-slate-800/50 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5); /* border-slate-700/50 */
        }
        .btn {
            transition: all 0.2s ease-in-out;
        }
        .btn:active {
            transform: scale(0.96);
            filter: brightness(0.9);
        }
        .list-item {
            background-color: #1f2937; /* bg-gray-800 */
            border: 1px solid #374151; /* border-gray-700 */
            transition: all 0.2s ease;
        }
        .list-item:hover {
            background-color: #374151; /* bg-gray-700 */
            border-color: #4f46e5; /* border-indigo-600 */
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-200 flex items-center justify-center">

    <div class="phone-container relative overflow-hidden">
        <!-- 1. 첫 페이지 (메인 메뉴) -->
        <div id="main-menu-view" class="relative flex flex-col flex-grow justify-center items-center p-8 gap-6">
            <div class="absolute top-4 right-4">
                <button onclick="toggleMainSettingsModal(true)" class="btn w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-lg"><i class="fas fa-cog"></i></button>
            </div>
            <div class="text-center">
                <h1 class="text-3xl font-bold text-white">OPIc 연습 프로그램</h1>
                <p class="text-gray-400 mt-2">원하는 모드를 선택하세요.</p>
            </div>
            <div class="w-full space-y-4">
                <button onclick="startOpicMode()" class="btn w-full bg-indigo-600 text-white font-bold py-4 rounded-lg text-lg">OPIc 연습</button>
                <button id="continue-btn" onclick="continueLastSession()" class="hidden btn w-full bg-sky-600 text-white font-bold py-4 rounded-lg text-lg">마지막 학습 이어하기</button>
                <button onclick="startReadKoreanMode()" class="btn w-full bg-gray-700 text-gray-300 font-bold py-4 rounded-lg text-lg">한글로 읽기</button>
                <button onclick="startReadEnglishMode()" class="btn w-full bg-gray-700 text-gray-300 font-bold py-4 rounded-lg text-lg">영어로 읽기</button>
            </div>
        </div>

        <!-- 2. 대제목 리스트 뷰 -->
        <div id="topic-list-view" class="hidden p-4 flex flex-col h-full">
            <header class="flex-shrink-0 flex items-center gap-4 mb-4">
                <button onclick="goBack()" class="btn w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center"><i class="fas fa-arrow-left"></i></button>
                <h2 class="text-xl font-bold text-white">주제 선택</h2>
            </header>
            <main id="topic-list-container" class="flex-grow overflow-y-auto no-scrollbar space-y-3"></main>
        </div>

        <!-- 3. 소제목 리스트 뷰 -->
        <div id="subtopic-list-view" class="hidden p-4 flex flex-col h-full">
            <header class="flex-shrink-0 flex items-center gap-4 mb-4">
                <button onclick="goBack()" class="btn w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center"><i class="fas fa-arrow-left"></i></button>
                <h2 id="subtopic-list-title" class="text-xl font-bold text-white flex-grow">소제목 선택</h2>
                <button id="reset-topic-progress-btn" onclick="resetCurrentTopicProgress()" class="btn text-sm text-gray-400 hover:text-white flex-shrink-0">진행도 초기화</button>
            </header>
            <main id="subtopic-list-container" class="flex-grow overflow-y-auto no-scrollbar space-y-3"></main>
        </div>

        <!-- 4. 연습 뷰 -->
        <div id="practice-view" class="hidden p-4 flex flex-col h-full">
            <header class="flex-shrink-0 flex items-center gap-4 mb-4">
                <button onclick="goBack()" class="btn w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center"><i class="fas fa-arrow-left"></i></button>
                <div class="flex-grow overflow-hidden">
                    <h2 id="practice-title" class="text-lg font-bold text-white"></h2>
                    <p id="practice-progress" class="text-sm text-gray-400"></p>
                </div>
                <button onclick="toggleSettingsModal(true)" class="btn w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center flex-shrink-0"><i class="fas fa-cog"></i></button>
            </header>
            
            <main class="flex-grow flex flex-col gap-4 overflow-hidden">
                <!-- 질문 영역 -->
                <div id="question-area" class="glass-ui rounded-lg p-5 flex-grow flex flex-col justify-center gap-4">
                    <div class="flex items-center gap-3">
                        <span class="text-indigo-400 font-bold text-sm">EN</span>
                        <p id="question-en" class="text-lg font-semibold text-white flex-grow"></p>
                        <button onclick="replayEnglishQuestion()" class="btn w-8 h-8 bg-blue-600/50 text-white rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>
                    <hr class="border-gray-700">
                    <div class="flex items-start gap-3">
                        <span class="text-gray-400 font-bold text-sm mt-1">KR</span>
                        <p id="question-ko" class="text-md text-gray-300 flex-grow"></p>
                    </div>
                </div>

                <!-- 답변 영역 -->
                <div id="answer-area" class="hidden glass-ui rounded-lg p-5 flex-grow flex flex-col justify-center gap-4">
                     <div class="flex items-start gap-3">
                        <span class="text-gray-400 font-bold text-sm mt-1">KR</span>
                        <p id="answer-ko" class="text-lg font-semibold text-white flex-grow"></p>
                    </div>
                    <hr class="border-gray-700">
                    <div id="answer-en-container" class="hidden flex flex-col gap-4">
                        <div class="flex items-center gap-3">
                            <span class="text-indigo-400 font-bold text-sm">EN</span>
                            <p id="answer-en" class="text-2xl text-gray-300 flex-grow leading-relaxed"></p>
                            <button onclick="replayEnglishAnswer()" class="btn w-8 h-8 bg-blue-600/50 text-white rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-volume-up"></i>
                            </button>
                        </div>
                        <!-- 전체 답안 보기 버튼 및 영역 -->
                        <button id="show-full-answer-btn" onclick="toggleFullAnswer()" class="hidden btn w-full bg-gray-600 text-white font-semibold py-2 rounded-lg text-sm mt-2">
                            <i class="fas fa-eye mr-2"></i> 전체 답안 보기
                        </button>
                        <div id="full-answer-display" class="hidden mt-2 p-3 bg-gray-900/50 rounded-lg">
                            <p id="full-answer-text" class="text-2xl text-gray-300 leading-relaxed"></p>
                        </div>
                    </div>
                    <div id="listening-indicator" class="hidden text-center text-blue-400 font-semibold h-8 flex items-center justify-center"><i class="fas fa-microphone-alt fa-beat mr-2"></i> 듣고 있어요...</div>
                </div>
            </main>

            <footer class="flex-shrink-0 grid grid-cols-2 gap-4 pt-4">
                <button onclick="navigate(-1)" class="btn bg-gray-700 text-white font-bold rounded-lg flex items-center justify-center gap-2 aspect-[2/1]">
                    <i class="fas fa-chevron-left"></i> 이전
                </button>
                <button onclick="navigate(1)" class="btn bg-indigo-600 text-white font-bold rounded-lg flex items-center justify-center gap-2 aspect-[2/1]">
                    다음 <i class="fas fa-chevron-right"></i>
                </button>
            </footer>
        </div>

        <!-- 5. 읽기 모드 뷰 (한글/영어 공용) -->
        <div id="reading-view" class="hidden p-4 flex flex-col h-full">
            <header class="flex-shrink-0 flex items-center gap-4 mb-4">
                <button onclick="goBack()" class="btn w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center"><i class="fas fa-arrow-left"></i></button>
                <div class="flex-grow overflow-hidden">
                    <h2 id="reading-title" class="text-lg font-bold text-white"></h2>
                </div>
            </header>
            
            <main class="flex-grow flex flex-col gap-4 overflow-hidden">
                <!-- 질문/답변 영역 -->
                <div id="reading-content-area" class="glass-ui rounded-lg p-5 flex-grow flex flex-col justify-center gap-4">
                    <!-- This will be populated by JS -->
                </div>
            </main>

            <footer class="flex-shrink-0 pt-4 space-y-4">
                <button id="continuous-play-btn" onclick="toggleContinuousPlay()" class="btn w-full bg-purple-600 text-white font-bold py-4 rounded-lg text-lg"><i class="fas fa-infinity mr-2"></i> 연속 듣기</button>
                <button id="sentence-practice-btn" onclick="toggleSentenceBySentencePractice()" class="hidden btn w-full bg-teal-600 text-white font-bold py-4 rounded-lg text-lg"><i class="fas fa-headphones-alt mr-2"></i> 한 문장씩 연습하기</button>
                <div class="grid grid-cols-3 gap-4">
                    <button onclick="navigateReadingMode(-1)" class="btn bg-gray-700 text-white font-bold rounded-lg flex items-center justify-center gap-2 aspect-[3/2]">
                        <i class="fas fa-chevron-left"></i> 이전
                    </button>
                    <button id="pause-play-btn" onclick="togglePausePlay()" class="btn bg-gray-600 text-white font-bold rounded-lg flex items-center justify-center text-2xl aspect-[3/2]">
                        <i class="fas fa-pause"></i>
                    </button>
                    <button onclick="navigateReadingMode(1)" class="btn bg-indigo-600 text-white font-bold rounded-lg flex items-center justify-center gap-2 aspect-[3/2]">
                        다음 <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </footer>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="hidden absolute inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
            <div class="glass-ui rounded-xl p-6 w-full max-w-sm">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-white">설정</h3>
                    <button onclick="toggleSettingsModal(false)" class="btn w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-700"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="space-y-6">
                    <!-- Volume Control -->
                    <div>
                        <label for="volume-slider" class="block text-sm font-medium text-gray-300 mb-2">음량 조절</label>
                        <input id="volume-slider" type="range" min="0.1" max="1" step="0.1" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Speed Control -->
                    <div>
                        <label for="rate-slider" class="block text-sm font-medium text-gray-300 mb-2">재생 속도</label>
                        <input id="rate-slider" type="range" min="0.5" max="1.5" step="0.1" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Menu Settings Modal -->
        <div id="main-settings-modal" class="hidden absolute inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
            <div class="glass-ui rounded-xl p-6 w-full max-w-sm">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-white">설정</h3>
                    <button onclick="toggleMainSettingsModal(false)" class="btn w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-700"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">데이터 관리</label>
                        <button onclick="resetAllData()" class="btn w-full bg-red-800 hover:bg-red-700 text-white font-bold py-3 rounded-lg">전체 기록 초기화</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="generated_opicData.js"></script>
    <script>
        // --- STATE MANAGEMENT ---
        let activeTopicIndex = null;
        let activeSubTopicIndex = null;
        let currentStage = 'question'; // 'question' or 'answer'
        let currentAnswerSentenceIndex = -1;

        let answerSentences = { ko: [], en: [] };
        let viewStack = ['main-menu-view'];
        let currentAppMode = 'opic'; // 'opic', 'read-korean', or 'read-english'
        let isContinuousPlayActive = false;
        let isSentencePracticeActive = false;
        let isManuallyPaused = false;
        let sentenceQueue = [];
        let currentSentenceIndexInQueue = 0;
        let originalOnEndCallback = null;

        let currentSpeechProps = {
            text: '',
            lang: '',
            onEndCallback: null,
            lastCharIndex: 0
        };
        let playbackRate = 1.0;
        let playbackVolume = 1.0;

        // AudioContext for sound effects
        let audioContext;
        let correctSoundBuffer;

        // Speech Recognition state
        let recognition;
        let isRecognizing = false;
        let correctWordsForSpeech = [];
        let shouldBeRecognizing = false;
        let finalTranscript = '';

        // --- DOM ELEMENTS ---
        const views = {
            main: document.getElementById('main-menu-view'),
            topics: document.getElementById('topic-list-view'),
            subtopics: document.getElementById('subtopic-list-view'),
            practice: document.getElementById('practice-view'),
            reading: document.getElementById('reading-view'),
        };
        const settingsModal = document.getElementById('settings-modal');
        const mainSettingsModal = document.getElementById('main-settings-modal');
        const volumeSlider = document.getElementById('volume-slider');
        const rateSlider = document.getElementById('rate-slider');
        const continuousPlayBtn = document.getElementById('continuous-play-btn');
        const listeningIndicator = document.getElementById('listening-indicator');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            // Pre-load voices for TTS
            speechSynthesis.getVoices();

            // Check for last session and show continue button if it exists
            const continueBtn = document.getElementById('continue-btn');
            if (localStorage.getItem(LAST_SESSION_KEY)) {
                continueBtn.classList.remove('hidden');
            }

            // Load saved settings
            playbackRate = parseFloat(localStorage.getItem(RATE_STORAGE_KEY)) || 1.0;
            playbackVolume = parseFloat(localStorage.getItem(VOLUME_STORAGE_KEY)) || 1.0;
            rateSlider.value = playbackRate;
            volumeSlider.value = playbackVolume;

            // Add event listeners for sliders
            volumeSlider.addEventListener('input', (e) => {
                playbackVolume = parseFloat(e.target.value);
                localStorage.setItem(VOLUME_STORAGE_KEY, playbackVolume);
            });
            rateSlider.addEventListener('input', (e) => {
                playbackRate = parseFloat(e.target.value);
                localStorage.setItem(RATE_STORAGE_KEY, playbackRate);
            });

            // --- SPEECH RECOGNITION SETUP ---
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.lang = 'en-US';
                recognition.interimResults = true; // Enable for real-time feedback
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    isRecognizing = true;
                    if (shouldBeRecognizing) {
                        listeningIndicator.classList.remove('hidden');
                    }
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript + ' ';
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    updateWordVisibility(finalTranscript + interimTranscript);
                };

                recognition.onend = () => {
                    isRecognizing = false;
                    // If we are supposed to be listening, restart recognition.
                    if (shouldBeRecognizing) {
                        try {
                            recognition.start();
                        } catch(e) {
                            console.error("Error restarting recognition:", e);
                        }
                    } else {
                        listeningIndicator.classList.add('hidden');
                    }
                };

                recognition.onerror = (event) => {
                    // 'no-speech'는 onend에서 재시작으로 처리하고, 'aborted'는 navigate() 함수 등에서 의도적으로 중단시킨 것이므로 오류로 간주하지 않습니다.
                    if (event.error === 'no-speech' || event.error === 'aborted') {
                        return;
                    }
                    shouldBeRecognizing = false; // Stop restarting on other errors
                    listeningIndicator.classList.add('hidden');
                    handleRecognitionError(event.error);
                };
            } else {
                console.log("This browser does not support speech recognition.");
            }
        });

        // --- AUDIO CONTEXT SETUP for Sound Effects ---
        async function initAudioContext() {
            // Run only once
            if (audioContext) {
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                return;
            }

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const response = await fetch('https://actions.google.com/sounds/v1/notifications/quick_notification.ogg');
                const arrayBuffer = await response.arrayBuffer();
                correctSoundBuffer = await audioContext.decodeAudioData(arrayBuffer);
                console.log("Audio for sound effect loaded successfully.");
            } catch (e) {
                console.error("Failed to initialize AudioContext or load sound:", e);
                audioContext = null;
            }
        }

        function playCorrectSound() {
            if (!audioContext || !correctSoundBuffer) return;
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(playCorrectSound);
                return;
            }
            try {
                const source = audioContext.createBufferSource();
                source.buffer = correctSoundBuffer;
                const gainNode = audioContext.createGain();
                gainNode.gain.setValueAtTime(playbackVolume, audioContext.currentTime);
                source.connect(gainNode).connect(audioContext.destination);
                source.start(0);
            } catch (e) {
                console.error("Error playing sound effect:", e);
            }
        }

        function initAudioOnUserGesture() {
            if (!audioContext) {
                initAudioContext();
            } else if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // --- KEYDOWN EVENT LISTENER (for Volume Button) ---

        // --- LOCAL STORAGE (for Progress) ---
        const PROGRESS_STORAGE_KEY = 'opicAppProgress';
        const LAST_SESSION_KEY = 'opicAppLastSession';
        const RATE_STORAGE_KEY = 'opicAppRate';
        const VOLUME_STORAGE_KEY = 'opicAppVolume';

        function getProgressKey(topicIndex, subTopicIndex) {
            return `${topicIndex}-${subTopicIndex}`;
        }

        function saveProgress(topicIndex, subTopicIndex, stage, sentenceIndex) {
            try {
                const allProgress = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY)) || {};
                const key = getProgressKey(topicIndex, subTopicIndex);
                
                allProgress[key] = {
                    stage: stage,
                    sentenceIndex: sentenceIndex,
                };
                
                localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(allProgress));

                // Also save this as the last accessed session
                const lastSession = { topicIndex, subTopicIndex };
                localStorage.setItem(LAST_SESSION_KEY, JSON.stringify(lastSession));
            } catch (e) {
                console.error("Failed to save progress:", e);
            }
        }

        function loadProgress(topicIndex, subTopicIndex) {
            try {
                const allProgress = JSON.parse(localStorage.getItem(PROGRESS_STORAGE_KEY)) || {};
                return allProgress[getProgressKey(topicIndex, subTopicIndex)] || null;
            } catch (e) {
                console.error("Failed to load progress:", e);
                return null;
            }
        }

        // --- VIEW NAVIGATION ---
        function showView(viewId) {
            const currentViewId = viewStack[viewStack.length - 1];
            if (currentViewId === viewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);

            if (currentView) currentView.classList.add('hidden');
            if (nextView) nextView.classList.remove('hidden');
            
            viewStack.push(viewId);
        }

        function toggleSettingsModal(show) {
            if (show) {
                settingsModal.classList.remove('hidden');
            } else {
                settingsModal.classList.add('hidden');
            }
        }

        function toggleMainSettingsModal(show) {
            if (show) {
                mainSettingsModal.classList.remove('hidden');
            } else {
                mainSettingsModal.classList.add('hidden');
            }
        }

        function toggleContinuousPlay() {
            isContinuousPlayActive = !isContinuousPlayActive;
            if (isContinuousPlayActive) {
                continuousPlayBtn.innerHTML = '<i class="fas fa-stop-circle mr-2"></i> 연속 듣기 중지';
                continuousPlayBtn.classList.remove('bg-purple-600');
                continuousPlayBtn.classList.add('bg-red-600');
            } else {
                // speechSynthesis.cancel(); // 연속 듣기 중지 시 음성 재생을 중단하지 않고, 다음 자동 넘김만 방지합니다.
                continuousPlayBtn.innerHTML = '<i class="fas fa-infinity mr-2"></i> 연속 듣기';
                continuousPlayBtn.classList.remove('bg-red-600');
                continuousPlayBtn.classList.add('bg-purple-600');
            }
        }

        function goBack() {
            speechSynthesis.cancel(); // Stop any ongoing speech
            shouldBeRecognizing = false; // Stop recognition loop
            if (isRecognizing) {
                recognition.abort();
            }

            if (viewStack.length <= 1) return;

            const currentViewId = viewStack.pop();
            const prevViewId = viewStack[viewStack.length - 1];

            // If leaving practice view, save progress and refresh subtopic list
            if (currentViewId === 'practice-view') {
                saveProgress(activeTopicIndex, activeSubTopicIndex, currentStage, currentAnswerSentenceIndex);
                if (prevViewId === 'subtopic-list-view') {
                    renderSubTopicList(activeTopicIndex);
                }
            }

            // 읽기 모드를 나갈 때 연속 듣기 상태 초기화
            if (currentViewId === 'reading-view' && isContinuousPlayActive) {
                isContinuousPlayActive = false;
                continuousPlayBtn.innerHTML = '<i class="fas fa-infinity mr-2"></i> 연속 듣기';
                continuousPlayBtn.classList.remove('bg-red-600');
                continuousPlayBtn.classList.add('bg-purple-600');
            }
            // 읽기 모드를 나갈 때 한 문장씩 연습하기 상태 초기화
            if (currentViewId === 'reading-view' && isSentencePracticeActive) {
                isSentencePracticeActive = false;
                const practiceBtn = document.getElementById('sentence-practice-btn');

        function navigate(direction) {
            speechSynthesis.cancel();
            shouldBeRecognizing = false; // Stop recognition loop when navigating manually
            if (isRecognizing) {
                recognition.abort();
            }

            const onKoreanSpeechEnd = () => {
                setTimeout(() => {
                    setupSpeakingUI();
                    startSpeechRecognition();
                }, 500);
            };

            if (currentStage === 'question') {
                if (direction > 0) { // '다음' from question
                    currentStage = 'answer';
                    currentAnswerSentenceIndex = 0;
                    updatePracticeView();
                    speak(answerSentences.ko[0], 'ko-KR', onKoreanSpeechEnd);
                    saveProgress(activeTopicIndex, activeSubTopicIndex, currentStage, currentAnswerSentenceIndex);
                }
                // '이전' from question does nothing, or could go back to subtopic list
            } else { // 'answer' stage
                if (direction > 0) { // '다음' from answer stage
                    const proceedToNextItem = () => {
                        const newIndex = currentAnswerSentenceIndex + 1;

                        if (newIndex >= answerSentences.ko.length) {
                            if (confirm('다음 문제로 넘어가겠습니까?')) {
                                saveProgress(activeTopicIndex, activeSubTopicIndex, 'answer', answerSentences.ko.length);
                                const newSubTopicIndex = activeSubTopicIndex + 1;
                                const totalSlidesInTopic = opicData[activeTopicIndex].slides.length;
                                if (newSubTopicIndex < totalSlidesInTopic) {
                                    startPractice(newSubTopicIndex);
                                } else {
                                    alert('현재 주제의 마지막 문제입니다. 주제 선택 화면으로 돌아갑니다.');
                                    goBack();
                                }
                            }
                        } else {
                            currentAnswerSentenceIndex = newIndex;
                            updatePracticeView();
                            speak(answerSentences.ko[currentAnswerSentenceIndex], 'ko-KR', onKoreanSpeechEnd);
                            saveProgress(activeTopicIndex, activeSubTopicIndex, currentStage, currentAnswerSentenceIndex);
                        }
                    };

                    // [USER REQUEST] Show the full answer display while reading it out
                    const fullAnswerDisplay = document.getElementById('full-answer-display');
                    const showAnswerBtn = document.getElementById('show-full-answer-btn');
                    if (fullAnswerDisplay && showAnswerBtn) {
                        fullAnswerDisplay.classList.remove('hidden');
                        showAnswerBtn.innerHTML = '<i class="fas fa-eye-slash mr-2"></i> 답안 숨기기';
                    }

                    // Read the correct English answer for the current sentence, then proceed.
                    const fullEnglishAnswer = answerSentences.en[currentAnswerSentenceIndex];
                    speak(fullEnglishAnswer, 'en-US', () => {
                        setTimeout(proceedToNextItem, 700); // Delay for smoothness
                    });

                } else { // '이전' from answer stage (direction < 0)
                    const newIndex = currentAnswerSentenceIndex + direction;
                    if (newIndex < 0) {
                        currentStage = 'question';
                        currentAnswerSentenceIndex = -1;
                        updatePracticeView();
                        speak(opicData[activeTopicIndex].slides[activeSubTopicIndex].question_en, 'en-US');
                        saveProgress(activeTopicIndex, activeSubTopicIndex, currentStage, currentAnswerSentenceIndex);
                    } else {
                        currentAnswerSentenceIndex = newIndex;
                        updatePracticeView();
                        speak(answerSentences.ko[currentAnswerSentenceIndex], 'ko-KR', onKoreanSpeechEnd);
                        saveProgress(activeTopicIndex, activeSubTopicIndex, currentStage, currentAnswerSentenceIndex);
                    }
                }
            }
        }

        function startSpeechRecognition() {

        function normalizeTextForCompare(text) {
            return text.toLowerCase().replace(/[.,!?]/g, "").trim();
        }

        function levenshtein(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    const cost = b.charAt(i - 1) === a.charAt(j - 1) ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + cost,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
                }
            }
            return matrix[b.length][a.length];
        }

        function updateWordVisibility(transcript) {
            const spokenWords = normalizeTextForCompare(transcript).split(/\s+/).filter(w => w);
            const placeholderSpans = document.getElementById('answer-en').querySelectorAll('.word-placeholder');
            
            const revealedCorrectIndices = new Set();
            const correctWordsUsed = new Array(correctWordsForSpeech.length).fill(false);

            // For each SPOKEN word, find the best match from the UNUSED CORRECT words
            spokenWords.forEach((spokenWord) => {
                let bestMatchCorrectIndex = -1;
                let minDistance = Infinity;

                correctWordsForSpeech.forEach((correctWord, correctIndex) => {
                    if (correctWordsUsed[correctIndex]) return; // Skip already matched correct words

                    const normalizedCorrect = normalizeTextForCompare(correctWord);
                    const distance = levenshtein(spokenWord, normalizedCorrect);

                    if (distance < minDistance) {
                        minDistance = distance;
                        bestMatchCorrectIndex = correctIndex;
                    }
                });

                // Check if the best match is good enough
                if (bestMatchCorrectIndex !== -1) {
                    const bestMatchCorrectWord = correctWordsForSpeech[bestMatchCorrectIndex];
                    const normalizedBestMatch = normalizeTextForCompare(bestMatchCorrectWord);
                    const threshold = normalizedBestMatch.length <= 2 ? 0 : (normalizedBestMatch.length < 6 ? 1 : (normalizedBestMatch.length < 10 ? 2 : 3));
                    
                    if (minDistance <= threshold) {
                        revealedCorrectIndices.add(bestMatchCorrectIndex);
                        correctWordsUsed[bestMatchCorrectIndex] = true; // Mark this correct word as used
                    }
                }
            });

            // Update the UI based on the matches found
            placeholderSpans.forEach((span, index) => {
                const correctWord = correctWordsForSpeech[index];
                if (revealedCorrectIndices.has(index)) {
                    span.textContent = correctWord;
                    span.classList.remove('opacity-40');
                    span.classList.add('opacity-100', 'text-green-400');
                } else {
                    const block = '█'.repeat(correctWord.length);
                    span.textContent = block;
                    span.classList.remove('opacity-100', 'text-green-400');
                    span.classList.add('opacity-40');
                }
            });

            // [NEW FEATURE] Check if all words are revealed to auto-navigate
            if (correctWordsForSpeech.length > 0 && revealedCorrectIndices.size === correctWordsForSpeech.length && shouldBeRecognizing) {
                // Stop recognition immediately to prevent re-triggering
                shouldBeRecognizing = false;
                if (isRecognizing) {
                    recognition.abort();
                }

                // [USER REQUEST] Play success sound
                playCorrectSound();

                // Use a timeout to give the user a moment to see the completed sentence
                setTimeout(() => {
                    // By just calling navigate(1), we use the same logic as the "Next" button,
                    // which already reads the answer once before proceeding. This prevents double playback.
                    navigate(1);
                }, 1200); // 1.2-second delay before reading the correct answer
            }
        }

        function handleRecognitionError(error) {
            // shouldBeRecognizing is already set to false in the onerror handler
            let message = '음성 인식 중 오류가 발생했습니다.';
            if (error === 'no-speech') {
                // This is now handled by the onend logic, so we can just ignore it.
                return;
            } else if (error === 'audio-capture') {
                message = '마이크를 사용할 수 없습니다. 마이크 권한 및 연결을 확인해주세요.';
            } else if (error === 'not-allowed') {
                message = '마이크 사용이 차단되었습니다. 브라우저의 사이트 설정에서 마이크 권한을 허용해주세요.';
            }
            alert(message);
        }

                // '연속 듣기'가 꺼져있고 연습이 끝난 경우에만 버튼 상태를 초기화합니다.
                isSentencePracticeActive = false;

                practiceBtn.classList.remove('bg-red-600');
                practiceBtn.classList.add('bg-teal-600');
                return;
            }

            // 다음 문장을 재생하고, 재생이 끝나면 상태에 따라 다음 문장을 호출합니다.
            speak(sentencePracticeSentences[index], 'ko-KR', () => {
                if (isSentencePracticeActive) {
                    // '한 문장씩 연습하기'가 켜져 있으면 3초 후 다음 문장 재생
                    setTimeout(() => {
                        readSentencesWithDelay(index + 1);
                    }, 3000);
                } else {
                    // '한 문장씩 연습하기'가 꺼져 있으면 바로 다음 문장 재생
                    readSentencesWithDelay(index + 1);
                }

        function toggleSentenceBySentencePractice() {
            isSentencePracticeActive = !isSentencePracticeActive;
            const practiceBtn = document.getElementById('sentence-practice-btn');

            if (isSentencePracticeActive) {
                practiceBtn.innerHTML = '<i class="fas fa-stop-circle mr-2"></i> 연습 중지';
                practiceBtn.classList.remove('bg-teal-600');
                practiceBtn.classList.add('bg-red-600');

                // 현재 재생 중인 음성(질문 등)을 중지합니다.
                speechSynthesis.cancel();
                
                // 화면을 한글 답변으로 즉시 전환합니다.
                const slide = opicData[activeTopicIndex].slides[activeSubTopicIndex];
                const contentArea = document.getElementById('reading-content-area');
                const answerTextForDisplay = (slide.answer_ko || '').replace(/\n/g, '<br>');
                contentArea.innerHTML = `<p class="text-lg font-semibold text-white flex-grow">${answerTextForDisplay}</p>`;

                // 한 문장씩 연습을 시작합니다.
                let startIndex = 0;
                // 만약 전체 답변을 듣는 도중에 '한 문장씩 연습하기'를 눌렀다면,
                // 현재 재생 중이던 문장부터 연습을 시작합니다. (lang 코드로 질문/답변 구분)
                if (currentSpeechProps.lang === 'ko-KR') {
                    startIndex = currentSentenceIndexInQueue;
                }
                sentencePracticeSentences = (slide.answer_ko || '').split('\n').filter(s => s.trim() !== '');
                readSentencesWithDelay(startIndex);

            } else {
                // 기능을 끌 때, 재생 중인 음성은 멈추지 않고 다음 3초 딜레이만 건너뛰게 됩니다.
                practiceBtn.innerHTML = '<i class="fas fa-headphones-alt mr-2"></i> 한 문장씩 연습하기';
                practiceBtn.classList.remove('bg-red-600');
                practiceBtn.classList.add('bg-teal-600');
            }
        }

        function playNextSentenceInQueue() {
            if (isManuallyPaused) return;

            currentSentenceIndexInQueue++;
            if (currentSentenceIndexInQueue < sentenceQueue.length) {
                const nextSentence = sentenceQueue[currentSentenceIndexInQueue];
                speakSentence(nextSentence, currentSpeechProps.lang, playNextSentenceInQueue);
            } else {
                if (originalOnEndCallback) {
                    originalOnEndCallback();
                    originalOnEndCallback = null; // Reset
                }
            }
        }

        // New function to speak a single sentence and update props
        function speakSentence(text, lang, onEndCallback) {
            currentSpeechProps.text = text;
            currentSpeechProps.lang = lang;
            currentSpeechProps.onEndCallback = onEndCallback;
            currentSpeechProps.lastCharIndex = 0;
            _speakInternal(text, lang, onEndCallback, 0);
        }

        // --- TTS (Text-to-Speech) ---

        function _speakInternal(text, lang, onEndCallback, startIndex = 0) {
            if (!text || !('speechSynthesis' in window)) {
                if (onEndCallback) onEndCallback();
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = playbackRate;
            utterance.volume = playbackVolume;

            const voices = speechSynthesis.getVoices();
            if (lang === 'ko-KR') {
                utterance.voice = voices.find(v => v.lang === 'ko-KR');
            } else if (lang.startsWith('en')) {
                utterance.voice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || voices.find(v => v.lang.startsWith('en'));
            }

            utterance.onboundary = (event) => {
                currentSpeechProps.lastCharIndex = startIndex + event.charIndex;
            };

            utterance.onend = () => {
                if (!isManuallyPaused) {
                    if (onEndCallback) onEndCallback();
                }
            };

            speechSynthesis.speak(utterance);
        }

        function speak(text, lang, onEndCallback = null) {
            speechSynthesis.cancel();
            isManuallyPaused = false;

            const pausePlayBtn = document.getElementById('pause-play-btn');
            if (pausePlayBtn) {
                pausePlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
                pausePlayBtn.classList.remove('bg-green-600');
                pausePlayBtn.classList.add('bg-gray-600');
            }

            sentenceQueue = (text || '').split('\n').filter(s => s.trim() !== '');
            currentSentenceIndexInQueue = 0;
            originalOnEndCallback = onEndCallback;

            if (sentenceQueue.length > 0) {
                const firstSentence = sentenceQueue[currentSentenceIndexInQueue];
                speakSentence(firstSentence, lang, playNextSentenceInQueue);
            } else {
                if (onEndCallback) onEndCallback();
            }
        }

        function togglePausePlay() {
            const pausePlayBtn = document.getElementById('pause-play-btn');
            if (!('speechSynthesis' in window)) return;

            if (isManuallyPaused) { // --- RESUME ---
                isManuallyPaused = false;
                pausePlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
                pausePlayBtn.classList.remove('bg-green-600');
                pausePlayBtn.classList.add('bg-gray-600');

                const lang = currentSpeechProps.lang;
                let textToResume;
                let startIndex = 0;

                // For English, onboundary is unreliable. As a compromise, restart the current sentence.
                // This is better than restarting the whole paragraph.
                if (lang.startsWith('en')) {
                    startIndex = 0;
                    textToResume = currentSpeechProps.text; // currentSpeechProps.text is now a single sentence
                } else { // For Korean, the onboundary event is reliable. Resume from the last character.
                    startIndex = currentSpeechProps.lastCharIndex;
                    textToResume = currentSpeechProps.text.substring(startIndex);
                }
                
                if (textToResume) {
                    // When resuming, the callback should be to play the *next* sentence in the queue.
                    _speakInternal(textToResume, lang, playNextSentenceInQueue, startIndex);
                }

            } else if (speechSynthesis.speaking) { // --- PAUSE ---
                isManuallyPaused = true;
                // Use cancel() for all languages. It's more responsive and avoids the delay issue with pause() on Korean.
                speechSynthesis.cancel(); 
                pausePlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                pausePlayBtn.classList.remove('bg-gray-600');
                pausePlayBtn.classList.add('bg-green-600');
            }
        }
    </script>
